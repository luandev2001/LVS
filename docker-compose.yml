services:
  redis:
    image: redis:8.2-alpine
    container_name: lab-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: lab-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: lab-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/phase14-alert-rules.yml:/etc/prometheus/phase14-alert-rules.yml:ro

  grafana:
    image: grafana/grafana:12.2.0
    container_name: lab-grafana
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: lab-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["4317:4317", "4318:4318"]
    volumes:
      - ./observability/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro

  tempo:
    image: grafana/tempo:2.8.2
    container_name: lab-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["3200:3200", "4319:4317"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml:ro

  inventory-db:
    image: postgres:18
    container_name: lab-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports: ["5433:5432"]
    volumes: [inventory-db-data:/var/lib/postgresql]

  facility-db:
    image: postgres:18
    container_name: lab-facility-db
    environment:
      POSTGRES_DB: facility_db
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports: ["5434:5432"]
    volumes: [facility-db-data:/var/lib/postgresql]

  accounting-db:
    image: postgres:18
    container_name: lab-accounting-db
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports: ["5435:5432"]
    volumes: [accounting-db-data:/var/lib/postgresql]

  payment-db:
    image: postgres:18
    container_name: lab-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports: ["5436:5432"]
    volumes: [payment-db-data:/var/lib/postgresql]

volumes:
  redis-data:
  inventory-db-data:
  facility-db-data:
  accounting-db-data:
  payment-db-data:
