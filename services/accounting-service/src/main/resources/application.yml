server:
  port: 8085

spring:
  application:
    name: accounting-service
  datasource:
    url: jdbc:postgresql://localhost:5435/accounting_db
    username: lab
    password: lab
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:20}
      group-id: accounting-payment-events
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
    listener:
      ack-mode: manual
      observation-enabled: true

payment:
  kafka:
    topic: payment.events.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.kafka.listener: true
    tags:
      application: accounting-service
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      service: accounting-service

logging:
  structured:
    format:
      console: ecs

saga:
  outbox:
    polling-ms: ${SAGA_OUTBOX_POLLING_MS:500}
    batch-size: ${SAGA_OUTBOX_BATCH_SIZE:50}
    stale-processing-ms: ${SAGA_OUTBOX_STALE_PROCESSING_MS:10000}

# Phase 12: consumer parallelism and poll/processing guardrails
lab:
  kafka:
    consumer-concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:20}
    max-poll-interval-ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
