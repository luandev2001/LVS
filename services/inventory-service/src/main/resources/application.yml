spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:inventory_db}
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:20}
      properties:
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual
      observation-enabled: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.kafka.listener: true
    tags:
      application: inventory-service
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      service: inventory-service

saga:
  outbox:
    polling-ms: ${SAGA_OUTBOX_POLLING_MS:500}
    batch-size: ${SAGA_OUTBOX_BATCH_SIZE:50}
    stale-processing-ms: ${SAGA_OUTBOX_STALE_PROCESSING_MS:10000}

cache:
  inventory:
    enabled: ${INVENTORY_CACHE_ENABLED:true}
    invalidation-enabled: ${INVENTORY_CACHE_INVALIDATION_ENABLED:true}
    ttl-seconds: ${INVENTORY_CACHE_TTL_SECONDS:30}
    lock-ttl-ms: ${INVENTORY_CACHE_LOCK_TTL_MS:5000}
    lock-wait-ms: ${INVENTORY_CACHE_LOCK_WAIT_MS:2000}
    simulated-db-delay-ms: ${INVENTORY_CACHE_SIMULATED_DB_DELAY_MS:0}

async:
  inventory:
    core-pool-size: ${INVENTORY_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${INVENTORY_ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${INVENTORY_ASYNC_QUEUE_CAPACITY:16}
    keep-alive-seconds: ${INVENTORY_ASYNC_KEEP_ALIVE_SECONDS:30}
    simulated-db-delay-ms: ${INVENTORY_ASYNC_SIMULATED_DB_DELAY_MS:0}

# Phase 12: consumer parallelism and poll/processing guardrails
lab:
  kafka:
    consumer-concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:20}
    max-poll-interval-ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}

# Phase 12 resilience experiment. Keep values small to make failure modes observable.
resilience:
  lab:
    bulkhead-permits: ${RESILIENCE_BULKHEAD_PERMITS:8}
    failure-threshold: ${RESILIENCE_FAILURE_THRESHOLD:3}
    open-ms: ${RESILIENCE_CIRCUIT_OPEN_MS:5000}

logging:
  structured:
    format:
      console: ecs
